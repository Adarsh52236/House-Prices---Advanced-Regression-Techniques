competition:
  id: "house-prices-advanced-regression-techniques"
  target_column: "SalePrice"
  id_column: "Id"
  random_seed: 42
  evaluation_metric: "RMSLE"

paths:
  raw_data_dir: "data/raw"
  interim_data_dir: "data/interim"
  processed_data_dir: "data/processed"
  models_dir: "models"
  reports_dir: "reports"
  submissions_dir: "submissions"

training:
  cv_folds: 5
  shuffle: true
  n_jobs: 4

models:
  active_model: "model_1_grandmaster"
  model_1_grandmaster:
    status: "in_development"
    stack:
      base_models:
        - "XGBoost Regressor"
        - "LightGBM Regressor"
        - "CatBoost Regressor"
        - "ElasticNetCV"
      meta_model: "RidgeCV"
    hyperparameters:
      xgboost:
        n_estimators: 600
        learning_rate: 0.02
        max_depth: 4
        subsample: 0.7
        colsample_bytree: 0.7
        random_state: 42
        n_jobs: 4
      lightgbm:
        n_estimators: 600
        learning_rate: 0.02
        max_depth: 4
        num_leaves: 15
        subsample: 0.7
        random_state: 42
        n_jobs: 4
        verbose: -1
      catboost:
        iterations: 600
        learning_rate: 0.02
        depth: 4
        verbose: 0
        random_seed: 42
        thread_count: 4
      elasticnet:
        l1_ratio: [0.1, 0.5, 0.7, 0.9, 0.95, 0.99, 1.0]
        alphas: [0.0001, 0.0005, 0.001, 0.01]
        cv: 5
        max_iter: 3000
        tol: 0.001
        random_state: 42
      ridge_meta:
        alphas: [0.1, 1.0, 10.0]
        cv: 5
  model_2_legacy:
    status: "not_started"
    stack:
      base_models:
        - "LassoCV"
        - "RidgeCV"
        - "HuberRegressor"
      meta_model: "LassoCV"
